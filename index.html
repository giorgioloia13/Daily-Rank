<!doctype html>
<html lang="it"><head><meta charset="utf-8">

<style>

:root[data-theme="dark"]{--bg:#14112a;--card:#1f1b3a;--tx:#f1eeff;--mut:#a8a2cc;--ac:#9b8cff;--ac2:#3ddbb4;--warm:#ff9a98;--bd:#322c5a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 100px}

.card:not(.hero) .bar i{background:linear-gradient(90deg,var(--ac),var(--ac2))}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.task:first-of-type{border-top:0}
.task input[type=checkbox]{width:24px;height:24px;accent-color:var(--ac2)}
.n{flex:1}.pt{font-weight:700;color:var(--ac)}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:9px 14px;cursor:pointer}

.days input{display:none}.days input:checked+span{font-weight:800;color:var(--ac)}

.chip{font-size:12px;padding:4px 8px;border-radius:10px;background:var(--bd)}.chip.full{background:var(--ac2);color:#fff}

.err{color:var(--warm);font-size:13px;min-height:18px}

.rk{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--bd)}
.dot{width:22px;height:22px;border-radius:50%}
.fxc{position:fixed;z-index:50;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--ac2);color:#fff;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;pointer-events:none;animation:pop .7s ease-out forwards}

@keyframes pulse{50%{transform:scale(1.2)}}
@keyframes rf{from{stroke-dashoffset:var(--c)}to{stroke-dashoffset:var(--o)}}
@media (prefers-reduced-motion:reduce){.fxc,.cf{display:none!important}.flame{animation:none}}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--bd);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);flex:1}
nav button span{font-size:24px;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--ac);font-weight:700}nav button.on span{filter:none;opacity:1}
.avs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.avs button{font-size:26px;padding:6px 10px}.avs button.on{border-color:var(--ac);background:var(--bd)}

<section class="tab" id="t-add">

<section class="tab" id="t-rank">

<section class="tab" id="t-me">

<div class="row"><div class="big" id="avbig" style="font-size:48px"></div><div class="mut" id="mexp"></div></div>

<div class="avs" id="avs"></div></div>
<div class="card"><h2>Impostazioni</h2>
<select id="theme"><option value="auto">Tema automatico</option><option value="light">Chiaro</option><option value="dark">Scuro</option></select>

</main>

<nav id="nav">

</nav>
